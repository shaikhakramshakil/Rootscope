spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/rootscope}
    username: ${SPRING_DATASOURCE_USERNAME:rootscope}
    password: ${SPRING_DATASOURCE_PASSWORD:rootscope}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

rootscope:
  kafka:
    enabled: ${ROOTSCOPE_KAFKA_ENABLED:false}
